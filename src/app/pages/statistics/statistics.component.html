<app-navbar></app-navbar>
<!-- Recordatorio: Canvas es un lienzo en blanco para dibujar programáticamente	 -->
<div class="container">
  <div class="header">
    <h2>Estadísticas del Negocio</h2>
    <div matTooltip="No hay gráficos con datos para exportar" *ngIf="noData">
    <button 
      mat-raised-button 
      color="primary" 
      class="export-pdf-btn"
      disabled
    >
      <span class="material-icons">picture_as_pdf</span>
      Exportar PDF
    </button>
  </div>

    <button 
      *ngIf="!noData"
      mat-raised-button 
      color="primary" 
      (click)="openExportDialog()" 
      class="export-pdf-btn"
    >
      <span class="material-icons">picture_as_pdf</span>
      Exportar PDF
    </button> 
  </div>

  <ng-container>
    <!-- Gráfico de Clientes -->
    <section class="chart-section">
      <div class="chart-header">
        <h3>Clientes Registrados</h3>
        <!-- 🔘 Botón de simulación demo -->
        <button 
          class="simulate-btn"
          (click)="toggleSimulacionCliente()"
          matTooltip="Simular estado sin datos"
        >
          {{ simulandoSinDatosC ? 'Restaurar' : 'Simular sin datos' }}
        </button>
        <div *ngIf="clientesData.length > 0" class="period-filter">
          <button 
            *ngFor="let period of periods" 
            [class.active]="clientesPeriodo === period.value"
            (click)="toggleClientesPeriodo(period.value)"
          >
            {{ period.label }}
          </button>
        </div>
      </div>
      <div *ngIf="clientesData.length == 0">No se encontraron datos</div>
      <canvas [style.display]="clientesData.length > 0 ? 'block' : 'none'" #clientesChart></canvas>
    </section>

    <!-- Gráfico de Alquileres -->
    <section class="chart-section">
      <div class="chart-header">
        <h3>Alquileres Realizados</h3>
          <!-- 🔘 Botón de simulación demo -->
        <button 
          class="simulate-btn"
          (click)="toggleSimulacionAlquileres()"
          matTooltip="Simular estado sin datos"
        >
          {{ simulandoSinDatosA ? 'Restaurar' : 'Simular sin datos' }}
        </button>
        <div *ngIf="alquileresData.length > 0" class="period-filter">
          <button 
            *ngFor="let period of periods" 
            [class.active]="alquileresPeriodo === period.value"
            (click)="toggleAlquileresPeriodo(period.value)"
          >7
            {{ period.label }}
          </button>
        </div>
      </div>
      <div *ngIf="alquileresData.length == 0">No se encontraron datos</div>
      <canvas [style.display]="alquileresData.length > 0 ? 'block' : 'none'" #alquileresChart></canvas>
      
    </section>

    <!-- Gráfico de Ingresos -->
    <section class="chart-section">
      <div class="chart-header">
        <h3>Ingresos</h3>
          <!-- 🔘 Botón de simulación demo -->
        <button 
          class="simulate-btn"
          (click)="toggleSimulacionIngresos()"
          matTooltip="Simular estado sin datos"
        >
          {{ simulandoSinDatosI ? 'Restaurar' : 'Simular sin datos' }}
        </button>
        <div *ngIf="ingresosData.length > 0" class="period-filter">
          <button 
            *ngFor="let period of periods" 
            [class.active]="ingresosPeriodo === period.value"
            (click)="toggleIngresosPeriodo(period.value)"
          >
            {{ period.label }}
          </button>
        </div>
      </div>
      <div *ngIf="ingresosData.length == 0">No se encontraron datos</div>
      <canvas [style.display]="ingresosData.length > 0 ? 'block' : 'none'" #ingresosChart ></canvas>
    </section>
  </ng-container>
</div>

<app-footer></app-footer>

<!-- Modal de exportación -->
<ng-template #exportModal>
  <div class="export-modal-container">
    <h2 class="export-modal-title">Exportar a PDF</h2>
    <div class="export-modal-content">
      <p class="export-modal-text">Selecciona los gráficos a incluir:</p>
      
      <div class="select-all-section">
        <mat-checkbox [(ngModel)]="exportAll" (change)="toggleSelectAll()" class="custom-checkbox">
          Seleccionar todos
        </mat-checkbox>
      </div>
      
      <div class="export-checkboxes">
        <mat-checkbox [(ngModel)]="exportClientes" (change)="updateSelectAll()" class="custom-checkbox" *ngIf="clientesData.length > 0">
          Clientes Registrados
        </mat-checkbox>
        <mat-checkbox [(ngModel)]="exportAlquileres" (change)="updateSelectAll()" class="custom-checkbox" *ngIf="alquileresData.length > 0">
          Alquileres Realizados
        </mat-checkbox>
        <mat-checkbox [(ngModel)]="exportIngresos" (change)="updateSelectAll()" class="custom-checkbox" *ngIf="ingresosData.length > 0">
          Ingresos
        </mat-checkbox>
      </div>
    </div>
    <div class="export-modal-actions">
      <button mat-button (click)="dialogRef.close()" class="cancel-btn">Cancelar</button>
      <button mat-raised-button (click)="exportarPDF()" class="export-btn" [disabled]="!hasSelection()">
        <span class="material-icons">picture_as_pdf</span>
        Exportar
      </button>
    </div>
  </div>
</ng-template>
